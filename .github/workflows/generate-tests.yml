name: KI-Tests aus Jira-Story erzeugen

on:
  workflow_dispatch:
    inputs:
      story_key:
        description: "Jira-Story, z. B. TB-1"
        required: true
  repository_dispatch:
    types: [jira-story-ready]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      STORY_KEY: ${{ github.event.inputs.story_key || github.event.client_payload.story_key }}
    steps:
      - name: Story-Nummer pruefen
        run: |
          if [[ ! "$STORY_KEY" =~ ^TB-[0-9]+$ ]]; then
            echo "Ungueltige Story-Nummer: $STORY_KEY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Abhaengigkeiten installieren
        run: pip install -r ai/requirements.txt

      - name: Tests erzeugen
        working-directory: ai
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_tests.py "$STORY_KEY"

      - name: Pull Request anlegen
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ki-tests/${{ env.STORY_KEY }}
          commit-message: "${{ env.STORY_KEY }}: KI-generierte API-Tests"
          title: "${{ env.STORY_KEY }}: KI-generierte API-Tests"
          body: |
            Automatisch erzeugt aus der Jira-Story ${{ env.STORY_KEY }}.
            Bitte vor dem Mergen anhand der Review-Checkliste pruefen.
